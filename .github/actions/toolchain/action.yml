name: toolchain
description: Install the Rust toolchain pinned in engine/rust-toolchain.toml and restore the cargo cache.
inputs:
  targets:
    description: Extra rustup targets, space separated.
    default: ''
  cache:
    description: Restore and save ~/.cargo and engine/target.
    default: 'true'
  key:
    description: Cache key suffix, one per job shape.
    default: default
runs:
  using: composite
  steps:
    - name: install the pinned toolchain
      shell: bash
      working-directory: engine
      run: |
        rustup toolchain install --profile minimal
        if [ -n "${{ inputs.targets }}" ]; then rustup target add ${{ inputs.targets }}; fi
        rustc -vV
    - name: cargo cache
      if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          engine/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}-

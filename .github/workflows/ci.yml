name: ci

on:
  push:
    branches: [master, dev-hotschmoe]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PY_PKGS: ezdxf pypdf pypdfium2 pillow numpy

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          key: lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p kerf-wasm -- -D warnings

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          key: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - uses: ./.github/actions/wasm-opt

      - run: cargo build --release
      - name: golden gate (byte-identical exports, DXF and PDF audits)
        run: tests/check_golden.sh
      - name: wasm through wasm-opt, golden and ABI
        run: |
          node ../tools/build_wasm.mjs --require-wasm-opt
          node tests/wasm_golden.mjs
          node tests/wasm_check.mjs dist/kerf.wasm
      - run: node tests/cli_ergonomics.mjs "$PWD/target/release/kerf"
      - run: node tests/serve_smoke.mjs "$PWD/target/release/kerf"
      - run: node tests/platform_serve.mjs "$PWD/target/release/kerf"

      # Debug has overflow checks and debug assertions on.
      - name: mutation fuzz on a debug build
        run: |
          cargo build
          KERF=$PWD/target/debug/kerf python3 tests/fuzz.py 300 1

  web:
    runs-on: ubuntu-latest
    env:
      KERF_CHROME: /usr/bin/google-chrome
      KERF_CHROME_ARGS: --use-angle=swiftshader --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          key: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - uses: ./.github/actions/wasm-opt
      - name: tools dependencies (the e2e tests validate exports with them)
        working-directory: tools
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci --no-audit --no-fund
      - name: install, typecheck, unit tests
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:unit
      - name: build the UI for kerf serve and embed it in kerf
        run: |
          (cd apps/web && npm run build:serve)
          cd engine
          CARGO_TARGET_DIR=target/ui KERF_UI=../apps/web/dist-serve cargo build --release
      - name: the embedded UI passes the serve smoke test (CSP of the real index.html)
        run: node engine/tests/serve_smoke.mjs "$PWD/engine/target/ui/release/kerf"
      - name: browser tests
        working-directory: apps/web
        run: |
          npm run build
          npm run test:e2e
          npm run test:serve
          KERF_SERVE_BIN=$GITHUB_WORKSPACE/engine/target/ui/release/kerf npm run test:serve -- --real

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          key: macos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - run: cargo build --release
      - run: tests/check_golden.sh
      - run: node tests/cli_ergonomics.mjs "$PWD/target/release/kerf"
      - run: node tests/serve_smoke.mjs "$PWD/target/release/kerf"

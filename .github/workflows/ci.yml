name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: python tooling for the golden gate (DXF and PDF checkers)
        run: pip install --quiet ezdxf pypdf pypdfium2 pillow numpy

      - name: zig fmt --check
        run: zig fmt --check src

      - name: zig build test
        run: zig build test --summary all

      # Debug = safety-checked: the build the fuzzer, the goldens, the CLI tests and the server smoke test exercise.
      - name: build the CLI (Debug, all safety checks on)
        run: zig build
      - name: golden gate (svg/dxf/pdf/png/drawing byte-identical, DXF and PDF audits)
        run: bash tests/check_golden.sh
      - name: CLI ergonomics tests
        run: node tests/cli_ergonomics.mjs
      - name: kerf serve smoke test (Debug build)
        run: node tests/serve_smoke.mjs
      - name: 'short fuzz run (300 mutated documents, seed 1; no crash, no signal)'
        run: python3 ../../tools/zig-engine/fuzz.py 300 1

      - name: wasm build + wasm golden (24 byte-identical outputs)
        run: |
          zig build wasm
          node ../../tools/zig-engine/wasm_golden.mjs dist/kerf.wasm
      # the module must build and pass the same golden with every safety check compiled in (REVIEW SAF-2, `no_panic` handler)
      - name: wasm build with safety checks (ReleaseSafe) + golden
        run: |
          zig build wasm -Dwasm-optimize=ReleaseSafe
          node ../../tools/zig-engine/wasm_golden.mjs dist/kerf.wasm

      # What ships is ReleaseSafe (REVIEW SAF-2): run the server smoke test against exactly that, too.
      - name: kerf serve smoke test (ReleaseSafe build, the shipped optimisation mode)
        run: |
          zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/release-safe"
          node tests/serve_smoke.mjs "$RUNNER_TEMP/release-safe/bin/kerf"
          node tests/cli_ergonomics.mjs "$RUNNER_TEMP/release-safe/bin/kerf"

      - name: cross-compile smoke (windows, macos, linux-musl; the agent bridge has a Windows job-object path)
        run: |
          for t in x86_64-windows-gnu aarch64-windows-gnu aarch64-macos x86_64-linux-musl aarch64-linux-musl; do
            zig build -Dtarget=$t -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/out-$t"
          done

  web:
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: wasm (the web build copies it)
        working-directory: engines/zig
        run: zig build wasm
      - name: install, typecheck, unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
      - name: build the UI and embed it in kerf
        working-directory: apps/web
        run: |
          npm run build:serve
          cd ../../engines/zig
          zig build -Doptimize=ReleaseSafe -Dui=../../apps/web/dist-serve
          ls -l zig-out/bin/kerf
      - name: the server with the embedded UI passes the smoke test (CSP of the real index.html)
        working-directory: engines/zig
        run: node tests/serve_smoke.mjs

name: ci

on:
  push:
    branches: [master, dev-hotschmoe]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  PY_PKGS: ezdxf pypdf pypdfium2 pillow numpy matplotlib
  KERF_CHROME: /usr/bin/google-chrome
  KERF_CHROME_ARGS: --use-angle=swiftshader --enable-unsafe-swiftshader
  KERF_PYTHON: python3

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      heavy: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
        with:
          key: lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p kerf-wasm -- -D warnings

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
        with:
          key: engine
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - uses: ./.github/actions/wasm-opt
      - run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci --no-audit --no-fund
        working-directory: tools
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: tests/gates.sh
        working-directory: engine

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
        with:
          key: web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - run: KERF_E2E_CASE='save / open .kerf.json round trip' node test/e2e.mjs
        working-directory: apps/web

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
        with:
          key: macos
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - run: cargo build --release
      - run: node tests/cli_e2e.mjs "$PWD/target/release/kerf"
      - run: node tests/serve_e2e.mjs "$PWD/target/release/kerf"
      - run: KERF="$PWD/target/release/kerf" node tests/check_golden.mjs truss-bearing-cmu flush-beam-strap hss-column-base-plate

  heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
        with:
          key: heavy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - uses: ./.github/actions/wasm-opt
      - run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci --no-audit --no-fund
        working-directory: tools
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: tests/test-heavy.sh
        working-directory: engine

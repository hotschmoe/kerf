# Release: on a version tag, gate on Windows and Linux, build the wasm and the web UI that `kerf serve` embeds, build the
# six binaries on native runners (asset names are what install.sh / install.ps1 download), smoke-run each, publish.
# workflow_dispatch is a dry run: everything is built and checked, the assets are uploaded as workflow artifacts and no
# release is created.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PY_PKGS: ezdxf pypdf pypdfium2 pillow numpy

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ver=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' engine/Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != v$ver (engine/Cargo.toml [workspace.package] version). Run tools/release.sh."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  windows-gate:
    needs: version
    uses: ./.github/workflows/windows.yml

  linux-gates:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          cache: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      - uses: ./.github/actions/wasm-opt

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p kerf-wasm -- -D warnings
      - run: cargo build --release
      - run: tests/check_golden.sh
      - name: wasm (wasm-opt is required)
        run: |
          node ../tools/build_wasm.mjs --require-wasm-opt
          node tests/wasm_golden.mjs
          node tests/wasm_check.mjs dist/kerf.wasm
          ls -l dist/kerf.wasm
      - run: node tests/cli_ergonomics.mjs "$PWD/target/release/kerf"
      - run: node tests/serve_smoke.mjs "$PWD/target/release/kerf"
      - run: node tests/platform_serve.mjs "$PWD/target/release/kerf"
      - name: mutation fuzz on a debug build
        run: |
          cargo build
          KERF=$PWD/target/debug/kerf python3 tests/fuzz.py 300 1
      - name: web UI for kerf serve (uses the wasm-opt module above)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:unit
          KERF_WASM=../../engine/dist/kerf.wasm npm run build:serve
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: apps/web/dist-serve
          if-no-files-found: error

  build:
    name: build ${{ matrix.asset }}
    needs: [version, windows-gate, linux-gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: kerf-x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: kerf-aarch64-linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: kerf-x86_64-windows.exe, crt: static }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: kerf-aarch64-windows.exe, crt: static }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: kerf-x86_64-macos }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: kerf-aarch64-macos }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          targets: ${{ matrix.target }}
          cache: 'false'
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: apps/web/dist-serve
      - name: build (release, UI embedded, stripped by the release profile)
        working-directory: engine
        env:
          KERF_UI: ../apps/web/dist-serve
          RUSTFLAGS: ${{ matrix.crt == 'static' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../release
          bin=target/${{ matrix.target }}/release/kerf
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          cp "$bin" "../release/${{ matrix.asset }}"
          ls -l ../release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet $PY_PKGS
      # The server puts its own directory on the agents' PATH and they call `kerf`, so the asset is run under that name.
      - name: smoke-run the binary on its own runner
        working-directory: engine
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          kerf="$RUNNER_TEMP/smoke/kerf"
          case "${{ matrix.asset }}" in *.exe) kerf="$kerf.exe" ;; esac
          cp "../release/${{ matrix.asset }}" "$kerf"
          chmod +x "$kerf"
          out=$("$kerf" version)
          echo "$out"
          case "$out" in *'"version":"${{ needs.version.outputs.version }}"'*) ;; *) echo "::error::version mismatch"; exit 1 ;; esac
          KERF="$kerf" node tests/check_golden.mjs
          node tests/serve_smoke.mjs "$kerf"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kerf-*
          path: release
          merge-multiple: true
      - name: checksums
        working-directory: release
        run: |
          sha256sum kerf-* > SHA256SUMS
          ls -l
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

# Release: on a version tag, build the web UI, embed it in `kerf`, cross-compile for every platform
# and attach the binaries (named exactly as install.sh / install.ps1 expect) plus SHA256SUMS.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # No release unless the Windows build starts a server and survives a field-shaped session on a Windows runner.
  windows-gate:
    uses: ./.github/workflows/windows.yml

  release:
    needs: windows-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version single source of truth: engines/zig/build.zig.zon `.version`. The tag must be "v" + that string.
      - name: Tag matches build.zig.zon version
        run: |
          zon=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' engines/zig/build.zig.zon)
          test "v$zon" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != v$zon (engines/zig/build.zig.zon .version). Bump the zon version, commit, then tag."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Order matters: the web build copies engines/zig/dist/kerf.wasm, and the CLI embeds the web build.
      - name: Build kerf.wasm
        working-directory: engines/zig
        run: zig build wasm

      - name: Build the web UI (workspace mode, for `kerf serve`)
        working-directory: apps/web
        run: |
          npm ci
          if npm run 2>/dev/null | grep -q 'build:serve'; then
            npm run build:serve
            echo "UI_DIR=../../apps/web/dist-serve" >> "$GITHUB_ENV"
          else
            npm run build:zig
            echo "UI_DIR=../../apps/web/dist-zig" >> "$GITHUB_ENV"
          fi

      # The release is gated by the same checks as CI, run against the build that ships (ReleaseSafe, REVIEW SAF-2).
      - name: Test the engine and the server
        working-directory: engines/zig
        run: |
          pip install --quiet ezdxf pypdf pypdfium2 pillow numpy
          zig build test --summary all
          zig build              # Debug (safety checks): what the golden gate exercises
          bash tests/check_golden.sh
          zig build -Doptimize=safe -Dui="$UI_DIR"
          node tests/cli_ergonomics.mjs
          node tests/serve_smoke.mjs

      # ReleaseSafe, not ReleaseSmall: bounds, overflow and cast checks stay on in the shipped CLI, so a bad input is a
      # clean error/abort instead of silent memory corruption (about +1.2 MB per target; the wasm stays ReleaseSmall).
      - name: Cross-compile kerf (UI embedded, ReleaseSafe)
        working-directory: engines/zig
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          build() { # <zig target> <asset name>
            rm -rf zig-out
            zig build -Dtarget="$1" -Doptimize=safe -Dstrip=true -Dui="$UI_DIR"
            if [ -f zig-out/bin/kerf.exe ]; then cp zig-out/bin/kerf.exe "$GITHUB_WORKSPACE/release/$2"; else cp zig-out/bin/kerf "$GITHUB_WORKSPACE/release/$2"; fi
          }
          build x86_64-windows-gnu   kerf-x86_64-windows.exe
          build aarch64-windows-gnu  kerf-aarch64-windows.exe
          build x86_64-linux-musl    kerf-x86_64-linux
          build aarch64-linux-musl   kerf-aarch64-linux
          build x86_64-macos         kerf-x86_64-macos
          build aarch64-macos        kerf-aarch64-macos
          cd "$GITHUB_WORKSPACE/release"
          sha256sum kerf-* > SHA256SUMS
          ls -l

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes   # not marked prerelease: install.sh/.ps1 use releases/latest
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

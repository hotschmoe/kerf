# The Windows gate. `kerf serve` shipped to Windows users broke twice in ways no Linux test can see (v0.1.0-alpha.6/.7: an
# `unreachable` inside std on the first document read), so CI runs the real thing on a Windows runner: unit tests, the full
# serve smoke suite, a field-shaped session (init, serve --open, the UI's document-open sequence, a 30 s agent run through
# an npm-style `grok.cmd` shim) and the CLI tests, against a Debug build (stack traces on) and against the shipped
# ReleaseSafe+stripped build with the web UI embedded. The arm64 binary is cross-compiled there and run on a Windows ARM
# runner (the Zig 0.16 compiler itself segfaults on windows-11-arm, so nothing is built on it). Called from ci.yml and release.yml; also runnable by hand.
name: windows

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [fix/windows-serve] # TEMP while iterating on the branch

jobs:
  windows:
    name: windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: engines/zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: zig build test
        run: zig build test --summary all

      - name: wasm + web UI (embedded into kerf.exe)
        run: |
          zig build wasm
          cd ../../apps/web
          npm ci
          npm run build:serve

      - name: build kerf.exe (Debug, UI embedded, stack traces on)
        run: zig build -Dui=../../apps/web/dist-serve
      - name: field-shaped session (init, serve --open, document-open sequence, 30 s grok.cmd run)
        run: node tests/windows_serve.mjs
      - name: serve smoke test
        run: node tests/serve_smoke.mjs
      - name: CLI ergonomics
        run: node tests/cli_ergonomics.mjs

      - name: build the shipped binary (ReleaseSafe, stripped, UI embedded) and run the same tests against it
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip=true -Dui=../../apps/web/dist-serve --prefix "$RUNNER_TEMP/release"
          node tests/windows_serve.mjs "$RUNNER_TEMP/release/bin/kerf.exe"
          node tests/serve_smoke.mjs "$RUNNER_TEMP/release/bin/kerf.exe"
          node tests/cli_ergonomics.mjs "$RUNNER_TEMP/release/bin/kerf.exe"

      - name: cross-compile the arm64 Windows binary for the ARM runner
        run: zig build -Dtarget=aarch64-windows-gnu -Doptimize=ReleaseSafe -Dstrip=true -Dui=../../apps/web/dist-serve --prefix "$RUNNER_TEMP/arm64"
      - name: arm64 variants for diagnosing a crash on the ARM runner
        run: |
          zig build -Dtarget=aarch64-windows-gnu -Dui=../../apps/web/dist-serve --prefix "$RUNNER_TEMP/arm64dbg"
          zig build -Dtarget=aarch64-windows-gnu -Doptimize=ReleaseSafe -Dui=../../apps/web/dist-serve --prefix "$RUNNER_TEMP/arm64rs"
          zig build -Dtarget=aarch64-windows-gnu -Doptimize=ReleaseSmall -Dui=../../apps/web/dist-serve --prefix "$RUNNER_TEMP/arm64rsm"
          zig build -Dtarget=aarch64-windows-gnu -Doptimize=ReleaseFast -Dui=../../apps/web/dist-serve --prefix "$RUNNER_TEMP/arm64rf"
          zig build -Dtarget=aarch64-windows-gnu -Doptimize=ReleaseSafe -Dstrip=true --prefix "$RUNNER_TEMP/arm64noui"
      - uses: actions/upload-artifact@v4
        with:
          name: kerf-aarch64-windows
          path: |
            ${{ runner.temp }}/arm64/bin/kerf.exe
            ${{ runner.temp }}/arm64dbg/bin/kerf.exe
            ${{ runner.temp }}/arm64rs/bin/kerf.exe
            ${{ runner.temp }}/arm64rsm/bin/kerf.exe
            ${{ runner.temp }}/arm64rf/bin/kerf.exe
            ${{ runner.temp }}/arm64noui/bin/kerf.exe

  windows-arm64:
    name: windows (windows-11-arm, aarch64 binary)
    needs: windows
    runs-on: windows-11-arm
    continue-on-error: true # best effort: a new runner image; the x86_64 job above is the gate
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: engines/zig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: kerf-aarch64-windows
          path: ${{ runner.temp }}/arm64
      - name: diagnose (Debug build, stack trace)
        continue-on-error: true
        run: |
          find "$RUNNER_TEMP/arm64" -name kerf.exe
          cd "$RUNNER_TEMP" && mkdir -p w && cd w
          for v in arm64dbg arm64rs arm64rsm arm64rf arm64noui arm64; do
            echo "=== $v"
            "$RUNNER_TEMP/arm64/$v/bin/kerf.exe" version; echo "version exit $?"
            "$RUNNER_TEMP/arm64/$v/bin/kerf.exe" new x.kerf.json; echo "new exit $?"
            "$RUNNER_TEMP/arm64/$v/bin/kerf.exe" init; echo "init exit $?"
            rm -f AGENTS.md CLAUDE.md x.kerf.json
          done
      - run: |
          node tests/windows_serve.mjs "$RUNNER_TEMP/arm64/arm64/bin/kerf.exe"
          node tests/serve_smoke.mjs "$RUNNER_TEMP/arm64/arm64/bin/kerf.exe"
          node tests/cli_ergonomics.mjs "$RUNNER_TEMP/arm64/arm64/bin/kerf.exe"

# The Windows gate. `kerf serve` shipped to Windows users broke in ways no Linux test can see, so the shipped
# configuration (release, static CRT, web UI embedded) is built and run on real Windows runners, x86_64 and native
# aarch64. Called from ci.yml and release.yml; also runnable by hand.
name: windows

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows x86_64, os: windows-latest }
          - { name: windows aarch64, os: windows-11-arm }
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          key: windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet ezdxf pypdf pypdfium2 pillow numpy

      - run: cargo clippy --all-targets -- -D warnings

      - name: web UI (builds the wasm first)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build:serve
      - name: build the shipped binary (release, static CRT, UI embedded)
        env:
          KERF_UI: ../apps/web/dist-serve
        run: cargo build --release

      - run: target/release/kerf.exe version
      - name: serve smoke test
        if: ${{ !cancelled() }}
        run: node tests/serve_smoke.mjs "$PWD/target/release/kerf.exe"
      - name: field-shaped session
        if: ${{ !cancelled() }}
        run: node tests/windows_serve.mjs "$PWD/target/release/kerf.exe"
      - name: CLI ergonomics
        if: ${{ !cancelled() }}
        run: node tests/cli_ergonomics.mjs "$PWD/target/release/kerf.exe"
      - name: platform checks
        if: ${{ !cancelled() }}
        run: node tests/platform_serve.mjs "$PWD/target/release/kerf.exe"
      - name: golden set (byte-identical to the Linux goldens)
        if: ${{ !cancelled() }}
        run: KERF="$PWD/target/release/kerf.exe" node tests/check_golden.mjs
      - name: Ctrl-Break stops the agent tree
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          powershell -NoProfile -File tests\ctrl_break.ps1 "$PWD\target\release\kerf.exe" $node "$PWD\tests\fake-agent.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

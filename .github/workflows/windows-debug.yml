# Windows reproduction harness for `kerf serve` (field bug: panic right after the banner on Windows).
name: windows-debug

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-serve]

jobs:
  serve:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wasm + UI
        run: |
          cd engines/zig; zig build wasm
          cd ../../apps/web; npm ci; npm run build:serve
      - name: build kerf.exe (Debug, UI embedded)
        run: |
          cd engines/zig
          zig build -Dui=../../apps/web/dist-serve
          Get-Item zig-out/bin/kerf.exe
      - name: manual repro (init, serve, serve --open, with .cmd agent shims)
        continue-on-error: true
        run: |
          $kerf = (Resolve-Path engines/zig/zig-out/bin/kerf.exe).Path
          $shim = Join-Path $env:RUNNER_TEMP shims
          New-Item -ItemType Directory $shim | Out-Null
          foreach ($n in 'grok','claude','pi','codex') { Set-Content -Path (Join-Path $shim "$n.cmd") -Value "@echo off`r`necho $n 1.2.3 (fake)" }
          Set-Content -Path (Join-Path $shim "pi.ps1") -Value "Write-Output 'pi 9'"
          $env:PATH = "$shim;$env:PATH"
          $work = Join-Path $env:RUNNER_TEMP details
          New-Item -ItemType Directory $work | Out-Null
          Set-Location $work
          & $kerf init
          "init exit $LASTEXITCODE"
          foreach ($flags in @(@(), @('--open'))) {
            "=== kerf serve $flags"
            $out = Join-Path $env:RUNNER_TEMP "out.txt"; $err = Join-Path $env:RUNNER_TEMP "err.txt"
            $p = Start-Process -FilePath $kerf -ArgumentList (@('serve','--port','0') + $flags) -WorkingDirectory $work -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            Start-Sleep -Seconds 6
            "exited: $($p.HasExited)"; if ($p.HasExited) { "exit code $($p.ExitCode)" }
            "--- stdout"; Get-Content $out
            "--- stderr"; Get-Content $err
            $m = [regex]::Match((Get-Content $out -Raw), 'http://127.0.0.1:(\d+)/\?token=(\w+)')
            if ($m.Success) {
              $port = $m.Groups[1].Value; $tok = $m.Groups[2].Value
              curl.exe -s -H "Authorization: Bearer $tok" "http://127.0.0.1:$port/api/info"
              ""
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: serve smoke test
        run: |
          cd engines/zig
          node tests/serve_smoke.mjs
      - name: cli ergonomics
        run: |
          cd engines/zig
          node tests/cli_ergonomics.mjs

[package]
name = "kerf-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf MCP server: stdio JSON-RPC 2.0 front end so any MCP client can build construction details"

[lib]
name = "kerf_mcp"
path = "src/lib.rs"

[[bin]]
name = "kerf-mcp"
path = "src/main.rs"

[dependencies]
kerf-core = { path = "../kerf-core" }
serde_json = { workspace = true }
# Pure-Rust SVG rasterizer for kerf_render. No text (the engine draws with its own stroke font,
# SVG output has no <text>), no raster images, no system fonts.
resvg = { version = "0.48", default-features = false }

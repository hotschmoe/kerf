[workspace]
resolver = "3"
members = ["kerf-core", "kerf-cli", "kerf-wasm"]
default-members = ["kerf-core", "kerf-cli"]

[workspace.package]
version = "0.1.0-alpha.11"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"

[profile.small]
inherits = "release"
opt-level = "z"

# Edit-compile-test loop with optimized code: no LTO, parallel codegen, incremental (PERF.md: about 4 s per edit
# instead of 33 s, runs about 1.1x slower than release). Gates: KERF=target/fastbuild/kerf tests/check_golden.sh
[profile.fastbuild]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# perf/callgrind builds: release codegen with symbols and line tables (see PERF.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

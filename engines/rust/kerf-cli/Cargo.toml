[package]
name = "kerf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kerf"
path = "src/main.rs"

[features]
default = ["mcp"]
# `kerf mcp`: stdio MCP server (adds resvg for PNG renders). Build with --no-default-features for the lean CLI.
mcp = ["dep:kerf-mcp"]

[dependencies]
kerf-core = { path = "../kerf-core" }
kerf-mcp = { path = "../kerf-mcp", optional = true }
serde_json = { workspace = true }
